<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07080c">
  <title>PARADOX//ACCESS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="grain"></div>
    <div class="grid"></div>

    <header class="topbar">
      <div class="brand"><span class="mark">P</span><span>PARADOX<span class="slash">//</span>ACCESS</span></div>
      <div class="status"><i></i>SYSTEM ONLINE</div>
    </header>

    <section class="login-shell" aria-label="Login">
      <div class="login-card">
        <div class="eyebrow">RESTRICTED TERMINAL</div>
        <h1>ACCESS<br><span>REQUIRED.</span></h1>
        <p class="subtitle">Authentication is mandatory. Nothing beyond this terminal exists.</p>

        <form id="loginForm" autocomplete="off">
          <label for="username">IDENTIFIER</label>
          <input id="username" name="username" type="text" placeholder="Enter identifier" spellcheck="false" required>

          <label for="password">ACCESS KEY</label>
          <input id="password" name="password" type="password" placeholder="Enter access key" required>

          <button type="submit">AUTHENTICATE <span>→</span></button>
        </form>

        <div id="message" class="message" aria-live="polite"></div>

        <div class="meta">
          <span>PARADOX NODE 01</span>
          <span>SESSION: <b id="session">LOCKED</b></span>
        </div>
      </div>
    </section>

    <footer>© 2026 PARADOX SYSTEMS <span>•</span> AUTHORIZED USERS ONLY</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
